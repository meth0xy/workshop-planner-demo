<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<script>try { document.querySelector('meta[name="color-scheme"]').content = localStorage.getItem("color-scheme") ?? "light dark"; } catch (e) {}</script>
<title>KFZ Thürwächter · Werkstattplaner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sofia+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Stecktafel: jeder Mechaniker hat eine Schiene, Termine sind gesteckte Karten. Der Kartenkopf trägt Uhrzeit und Stand.
   Hell für das Büro, dunkel für die Halle oder den Abend. Ohne Einstellung folgt die Seite dem System. */
:root {
  color-scheme: light dark;
  &:has(> head > meta[name="color-scheme"][content="dark"]) { color-scheme: dark; }
  &:has(> head > meta[name="color-scheme"][content="light"]) { color-scheme: light; }

  --ground:    light-dark(#C9D0D6, #0F1316);
  --board:     light-dark(#DCE2E7, #171C20);
  --ink:       light-dark(#14191E, #E6EAED);
  --ink-2:     light-dark(#47525D, #9DA8B2);
  --line:      light-dark(#B7C1C9, #2A3238);
  --line-soft: light-dark(#CDD4DA, #1F262B);
  --rail:      light-dark(#A9B4BD, #313A42);
  --bar:       light-dark(#1E2429, #0A0D0F);
  --bar-ink:   #FFFFFF;
  --bar-ink-2: light-dark(#B3BCC5, #98A3AD);
  --bar-chip:  light-dark(#363E46, #1F262B);
  --bar-chip-h: light-dark(#48515A, #2B343B);
  --panel:     light-dark(#F3F5F7, #1A1F24);
  --panel-2:   light-dark(#E3E8EC, #252C32);
  --panel-3:   light-dark(#D5DCE1, #2F373E);
  --card:      light-dark(#FFFFFF, #232A30);
  --card-gone: light-dark(#E7EBEE, #1C2227);
  --field:     light-dark(#FFFFFF, #111518);
  --search-bg: light-dark(#FFFFFF, #1C2227);
  --act:       light-dark(#1E2429, #E6EAED);
  --act-ink:   light-dark(#FFFFFF, #14191E);
  --act-h:     light-dark(#343C44, #FFFFFF);
  --danger:    light-dark(#B3261E, #FF8A80);
  --danger-bg: light-dark(#FBE9E7, #3A1D1B);
  --danger-fill: light-dark(#B3261E, #C9372C);
  --now: #D2342A;
  --h-plan: light-dark(#C3CCD4, #3A4550); --f-plan: light-dark(#14191E, #E6EAED);
  --h-da:   light-dark(#F5C400, #E5B800); --f-da:   #1C1800;
  --h-work: light-dark(#1D5BD1, #2F68D6); --f-work: #FFFFFF;
  --h-done: #1A7D45;                      --f-done: #FFFFFF;
  --h-gone: light-dark(#D0D7DC, #2A3238); --f-gone: light-dark(#515C67, #95A1AC);
  --hatch-a: light-dark(#D3D9DE, #2A3238);
  --hatch-b: light-dark(#FFFFFF, #1A1F24);
  --focus: light-dark(#14191E, #E6EAED);
  --sh-c: light-dark(rgb(20 25 30 / .14), rgb(0 0 0 / .45));
  --sh-c2: light-dark(rgb(20 25 30 / .24), rgb(0 0 0 / .6));
  --sh-card: 0 1px 0 var(--sh-c2), 0 2px 6px var(--sh-c);
  --sh-hover: 0 1px 0 var(--sh-c2), 0 6px 14px var(--sh-c);
  --sh-lift: 0 2px 0 var(--sh-c2), 0 16px 32px var(--sh-c2);
  --sh-float: 0 2px 4px var(--sh-c), 0 12px 32px var(--sh-c2);
  --scroll: light-dark(#8D99A4, #47525C);
  --backdrop: light-dark(rgb(20 25 30 / .45), rgb(0 0 0 / .6));

  --hour: 72px;
  --target: 2.25rem;
  --font: "Sofia Sans", "DIN Alternate", "Segoe UI", system-ui, sans-serif;
  --r: 3px;
  --panel-w: 23.5rem;
  --ease: cubic-bezier(.2, .8, .2, 1);
  /* Federn nach Art von SwiftUI: Antwortzeit und Dämpfung, als linear() abgetastet */
  --spring: linear(0, 0.062, 0.199, 0.361, 0.518, 0.654, 0.764, 0.849, 0.91, 0.952, 0.98, 0.997, 1.006, 1.01, 1.011, 1.01, 1.009, 1.007, 1.005, 1.004, 1.003, 1.002, 1);
  --snappy: linear(0, 0.063, 0.201, 0.361, 0.514, 0.646, 0.753, 0.835, 0.895, 0.937, 0.965, 0.983, 0.995, 1.001, 1.004, 1.005, 1.005, 1.004, 1.004, 1.003, 1.002, 1.001, 1);
  --t-spring: .58s;
  --t-snappy: .42s;
  /* Glas für die schwebende Bedienebene: Kopfzeilen über Tafel und Monat, Blatt, Meldungen, Dialoge */
  --glass:       light-dark(rgb(220 226 231 / .72), rgb(23 28 32 / .7));
  --glass-panel: light-dark(rgb(243 245 247 / .84), rgb(26 31 36 / .82));
  --glass-bar:   light-dark(rgb(30 36 41 / .86), rgb(10 13 15 / .8));
  --glass-edge:  light-dark(rgb(255 255 255 / .55), rgb(255 255 255 / .07));
  --blur: blur(18px) saturate(1.5);
  accent-color: var(--act);
  scrollbar-color: var(--scroll) transparent;
}
@media (pointer: coarse) { :root { --hour: 96px; --target: 2.75rem; } }
@supports not (transition-timing-function: linear(0, 1)) {
  :root { --spring: cubic-bezier(.2, .9, .25, 1.05); --snappy: cubic-bezier(.2, .9, .3, 1); }
}

*, *::before, *::after { box-sizing: border-box; }
html { font-size: 100%; -webkit-text-size-adjust: 100%; height: 100%; }
body {
  margin: 0; height: 100%; overflow: hidden;
  background: var(--ground); color: var(--ink);
  font: 400 0.9375rem/1.4 var(--font);
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
  caret-color: var(--ink);
}
@media (pointer: coarse) { body { font-size: 1.0625rem; } }
::selection { background: var(--panel-3); color: var(--ink); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3, p, dl, dd, ul { margin: 0; }
ul { padding: 0; list-style: none; }
svg { display: block; flex: none; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
[tabindex="-1"]:focus { outline: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
[hidden] { display: none !important; }

/* Grundgerüst */
.app { height: 100dvh; display: grid; grid-template: auto auto minmax(0, 1fr) / minmax(0, 1fr); }

/* Kopfleiste */
.bar {
  display: flex; align-items: center; flex-wrap: wrap; gap: .5rem .75rem;
  padding: .625rem max(1.25rem, env(safe-area-inset-right, 0px)) .625rem max(1.25rem, env(safe-area-inset-left, 0px));
  padding-top: calc(.625rem + env(safe-area-inset-top, 0px));
  background: var(--bar); color: var(--bar-ink);
  border-bottom: 1px solid light-dark(transparent, #232B31);
}
.bar :focus-visible { outline-color: #FFFFFF; }
.brand { flex-basis: 100%; min-width: 0; display: flex; align-items: center; gap: .625rem; margin-bottom: -.125rem; }
.brand h1 { font-size: .875rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.date-pick { position: relative; display: flex; align-items: center; }
.mo-nav { display: flex; gap: .25rem; margin-right: .875rem; }
.title {
  display: flex; align-items: center; gap: .5rem; min-height: var(--target);
  padding: 0 .5rem; margin-left: -.5rem; border: 0; border-radius: var(--r); background: none;
  font-size: 1.375rem; font-weight: 700; white-space: nowrap;
  transition: background-color .15s var(--ease);
}
.title:hover { background: var(--bar-chip); }
.title svg { width: .75rem; height: .75rem; opacity: .6; margin-top: .1rem; }
.date-pick input { position: absolute; left: 0; bottom: 0; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .45rem;
  min-height: var(--target); padding: 0 .875rem; border: 0; border-radius: var(--r);
  font-weight: 600; font-size: .875rem; white-space: nowrap;
  transition: background-color .15s var(--ease), box-shadow .15s var(--ease), color .15s var(--ease);
}
.btn svg { width: .8rem; height: .8rem; }
.bar .chip { background: var(--bar-chip); color: var(--bar-ink); }
.bar .chip:hover { background: var(--bar-chip-h); }
.seg { display: flex; gap: 2px; padding: 2px; border-radius: var(--r); background: var(--bar-chip); }
.seg .btn { min-height: calc(var(--target) - 4px); padding: 0 .75rem; border-radius: 2px; background: none; color: var(--bar-ink-2); }
.seg .btn:hover { color: var(--bar-ink); }
.seg .btn[aria-pressed="true"] { background: #FFFFFF; color: #14191E; }
.sum {
  display: flex; align-items: center; gap: .875rem; min-height: var(--target); padding: 0 .625rem;
  border: 0; border-radius: var(--r); background: none; color: var(--bar-ink-2); font-size: .875rem; white-space: nowrap;
  transition: background-color .15s var(--ease);
}
.sum:hover { background: var(--bar-chip); }
.sum b { color: var(--bar-ink); font-weight: 700; margin-right: .2rem; }
.sum span + span { padding-left: .875rem; border-left: 1px solid var(--bar-chip-h); }
.demo { color: var(--bar-ink-2); font-size: .75rem; font-weight: 500; border: 1px dashed var(--bar-chip-h); border-radius: var(--r); padding: .15rem .5rem; white-space: nowrap; }
.trail { flex: 1 1 35.5rem; display: flex; align-items: center; justify-content: flex-end; gap: .625rem; min-width: 0; }
.search {
  position: relative; display: flex; align-items: center; gap: .5rem;
  flex: 1; min-width: 0; max-width: 24rem; min-height: calc(var(--target) + .125rem);
  padding: .125rem .375rem .125rem .75rem; border-radius: var(--r);
  background: var(--search-bg); color: var(--ink);
  transition: box-shadow .15s var(--ease);
}
.search:focus-within { box-shadow: 0 0 0 2px var(--bar), 0 0 0 4px #FFFFFF; }
.search > svg { width: 1rem; height: 1rem; color: var(--ink-2); }
.search input {
  flex: 1; min-width: 0; height: 2.25rem; border: 0; outline: 0; background: none;
  font-size: .9375rem; font-weight: 500; -webkit-appearance: none; appearance: none;
}
.search input::placeholder { color: var(--ink-2); opacity: 1; font-weight: 400; }
.search input::-webkit-search-cancel-button { display: none; }
kbd {
  font: inherit; font-size: .75rem; font-weight: 600; padding: .05rem .4rem; border-radius: 4px;
  background: var(--panel-2); color: var(--ink-2); white-space: nowrap; box-shadow: inset 0 -1px 0 var(--line);
}
.search .clear { display: grid; place-items: center; width: var(--target); height: var(--target); border: 0; border-radius: var(--r); background: none; color: var(--ink-2); }
.search .clear:hover { background: var(--panel-2); color: var(--ink); }
.search .clear svg { width: .7rem; height: .7rem; }
.btn.new, .btn.find { background: #FFFFFF; color: #14191E; padding: 0 1rem; }
.btn.new:hover, .btn.find:hover { background: #E3E8EC; }
.btn.find svg, .btn.gear svg { width: 1rem; height: 1rem; }
.btn.ico { width: calc(var(--target) + .125rem); padding: 0; }
.trail .btn { flex: none; }

/* Wochenleiste */
.week {
  position: relative; display: flex; align-items: stretch; gap: .375rem; overflow-x: auto; scrollbar-width: none;
  padding: .5rem max(1.25rem, env(safe-area-inset-right, 0px)) .5rem max(1.25rem, env(safe-area-inset-left, 0px));
  background: var(--ground); box-shadow: 0 1px 0 var(--line);
}
.week::-webkit-scrollbar { display: none; }
.wk-nav { flex: none; width: var(--target); display: grid; place-items: center; border: 0; border-radius: var(--r); background: none; color: var(--ink-2); transition: background-color .15s var(--ease); }
.wk-nav:hover { background: var(--line-soft); color: var(--ink); }
.wk-nav svg { width: .875rem; height: .875rem; }
.wd {
  position: relative; z-index: 1; flex: 1 0 8.5rem; display: grid; grid-template-columns: auto 1fr; align-items: baseline; gap: .35rem .6rem;
  padding: .45rem .75rem .55rem; border: 0; border-radius: var(--r); background: none; text-align: left;
  transition: background-color .15s var(--ease), box-shadow .15s var(--ease);
}
.wd:hover { background: var(--line-soft); }
.wd-d { display: flex; align-items: baseline; gap: .35rem; font-weight: 700; font-size: .9375rem; white-space: nowrap; }
.wd-d small, .md-d small { font-size: .75rem; font-weight: 700; color: var(--board); background: var(--ink); border-radius: 2px; padding: 0 .3rem; }
.wd-f { font-size: .8125rem; color: var(--ink-2); text-align: right; white-space: nowrap; }
.wd-m { grid-column: 1 / -1; height: 3px; border-radius: 2px; background: var(--line); overflow: hidden; }
.wd-m i { display: block; height: 100%; background: var(--ink-2); }
.wd[aria-current="date"], .wd[aria-current="date"]:hover { background: none; }
.wk-pill { position: absolute; z-index: 0; border-radius: var(--r); background: var(--card); box-shadow: var(--sh-card); pointer-events: none; }
@media (forced-colors: active) { .wd[aria-current="date"] { outline: 2px solid CanvasText; } }
.wd[aria-current="date"] .wd-m { background: var(--line-soft); }
.wd[aria-current="date"] .wd-m i { background: var(--ink); }

/* Arbeitsfläche */
.work { grid-row: 3; min-height: 0; display: grid; grid-template: minmax(0, 1fr) / minmax(0, 1fr) var(--panel-w); }
.scroller:focus { outline: 0; }
.scroller, .month { position: relative; min-height: 0; overflow: auto; background: var(--board); overscroll-behavior: contain; scrollbar-color: var(--scroll) var(--board); }
.plate { position: relative; display: grid; grid-template-columns: 3.5rem repeat(var(--lanes), minmax(12.5rem, 1fr)); min-width: 100%; }
.corner { position: sticky; left: 0; top: 0; z-index: 6; background: var(--glass); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); box-shadow: 0 1px 0 var(--line); transition: box-shadow .25s var(--ease); }
.lh {
  position: sticky; top: 0; z-index: 5; display: grid; grid-template-columns: 1fr auto; align-items: baseline; gap: .2rem .5rem;
  padding: .65rem .75rem .7rem; border-left: 2px solid var(--rail); box-shadow: 0 1px 0 var(--line);
  background: var(--glass); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); transition: box-shadow .25s var(--ease);
}
.sy :is(.lh, .corner, .mo-h) { box-shadow: 0 1px 0 var(--line), 0 10px 18px -12px var(--sh-c2); }
.sx .times { box-shadow: 1px 0 0 var(--line), 10px 0 18px -12px var(--sh-c2); }
.lh strong { font-size: 1rem; font-weight: 700; }
.lh span { font-size: .8125rem; color: var(--ink-2); }
.lh em { grid-column: 1 / -1; display: flex; align-items: center; gap: .45rem; font-style: normal; font-size: .8125rem; font-weight: 600; color: var(--ink-2); }
.lh em i { width: .5rem; height: .5rem; border-radius: 50%; background: currentColor; flex: none; }
.lh.free em { color: var(--ink); }
.lh.free em i { background: none; box-shadow: inset 0 0 0 1.75px currentColor; }
.times { position: sticky; left: 0; z-index: 4; background: var(--glass); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); transition: box-shadow .25s var(--ease); }
.times span { position: absolute; right: .6rem; transform: translateY(-50%); font-size: .75rem; font-weight: 500; color: var(--ink-2); }
.times span.first { transform: none; margin-top: .3rem; }
.times .now-t { right: .3rem; padding: .1rem .35rem; border-radius: 3px; background: var(--now); color: #FFFFFF; font-size: .75rem; font-weight: 700; }
.lane {
  position: relative; border-left: 2px solid var(--rail); cursor: cell;
  background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(var(--line-soft) 1px, transparent 1px);
  background-size: 100% var(--hour), 100% calc(var(--hour) / 2);
}
.shut { position: absolute; left: 0; right: 0; cursor: default; }
.shut, .md.closed { background: repeating-linear-gradient(-45deg, var(--hatch-a) 0 6px, transparent 6px 12px) var(--line-soft); }
.hint-slot, .ghost {
  position: absolute; left: 4px; right: 4px; z-index: 1; pointer-events: none;
  display: flex; align-items: center; justify-content: center; gap: .4rem; overflow: hidden;
  border-radius: var(--r); font-size: .8125rem; font-weight: 600;
}
.hint-slot { animation: fade-in .16s var(--ease); transition: top .12s var(--ease), height .12s var(--ease); }
.hint-slot { border: 1.5px dashed var(--ink-2); color: var(--ink); background: color-mix(in srgb, var(--card) 60%, transparent); }
.hint-slot svg { width: .7rem; height: .7rem; }
.ghost { z-index: 3; flex-flow: column wrap; align-content: center; white-space: nowrap; border: 2px dashed var(--ink); background: color-mix(in srgb, var(--card) 65%, transparent); color: var(--ink); text-align: center; padding: 0 .5rem; }
.ghost:not(.draft) { transition: top .12s var(--ease), background-color .15s var(--ease); }
.ghost.bad { border-color: var(--ink); color: var(--ink); background: repeating-linear-gradient(-45deg, var(--hatch-a) 0 6px, var(--hatch-b) 6px 12px); }
.ghost.bad span { padding: 0 .3rem; background: var(--hatch-b); border-radius: 2px; }
.ghost .warn, .clash .warn { width: 1rem; height: 1rem; }
.now { position: absolute; left: 3.5rem; right: 0; height: 2px; z-index: 1; background: var(--now); pointer-events: none; }
.now::before, .now::after { content: ""; position: absolute; left: -4px; top: -3px; width: 8px; height: 8px; border-radius: 50%; background: var(--now); }
.now::after { animation: now-pulse 2.6s var(--ease) infinite; }
@keyframes now-pulse { 0% { scale: 1; opacity: .5; } 60%, 100% { scale: 3.2; opacity: 0; } }

/* Monat: eine Zelle je offenem Tag, gleiche Angaben wie in der Wochenleiste */
.mo { display: grid; grid-template-columns: repeat(var(--days), minmax(0, 1fr)); grid-template-rows: auto; grid-auto-rows: minmax(6.75rem, 1fr); gap: 1px; min-height: 100%; background: var(--line); }
.mo [role="row"] { display: contents; }
.mo [role="gridcell"] { display: grid; background: var(--board); }
.mo-h { position: sticky; top: 0; z-index: 1; padding: .5rem .75rem; background: var(--glass); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); box-shadow: 0 1px 0 var(--line); transition: box-shadow .25s var(--ease); font-size: .8125rem; font-weight: 700; color: var(--ink-2); }
.md {
  display: grid; align-content: start; justify-items: start; gap: .3rem; min-width: 0; padding: .55rem .75rem .7rem;
  border: 0; background: none; text-align: left; font-size: .8125rem; color: var(--ink-2);
  transition: background-color .15s var(--ease);
}
.md:hover { background: var(--line-soft); }
.md-d { display: flex; align-items: baseline; gap: .35rem; font-size: 1rem; font-weight: 700; color: var(--ink); }
.md-f, .md-a { font-weight: 600; color: var(--ink); }
.md-a { overflow-wrap: anywhere; hyphens: auto; }
.md-a .brief { display: none; }
.md .wd-m { justify-self: stretch; }
.md-s { display: inline-flex; align-items: center; gap: .3rem; padding: .1rem .45rem; border-radius: 2px; background: var(--card); color: var(--ink); font-size: .75rem; font-weight: 700; box-shadow: 0 0 0 1px var(--line); }
.md-s svg { width: .65rem; height: .65rem; }
.md.closed .md-d { color: var(--ink-2); }
.md.on { box-shadow: inset 0 0 0 2.5px var(--ink); }
.md:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }

/* Karten */
.card {
  position: absolute; left: 4px; right: 4px; z-index: 2; display: flex; flex-direction: column; overflow: hidden;
  border-radius: var(--r); background: var(--card); color: var(--ink-2); box-shadow: var(--sh-card);
  font-size: .8125rem; line-height: 1.3; cursor: grab; user-select: none; container-type: inline-size;
  -webkit-user-select: none; -webkit-touch-callout: none;
  transition: box-shadow .2s var(--ease);
}
.card:hover { box-shadow: var(--sh-hover); }
.card.leaving { pointer-events: none; z-index: 1; }
.card-head {
  position: relative; z-index: 2; display: flex; justify-content: space-between; align-items: center; gap: .5rem;
  padding: .22rem .6rem; background: var(--hb); color: var(--hf); font-size: .8125rem; font-weight: 700; touch-action: none;
}
.card-head .st { display: inline-flex; align-items: center; gap: .3rem; white-space: nowrap; font-weight: 600; }
.card-head .st svg { height: .7rem; width: auto; }
.card-head > span:first-child { white-space: nowrap; }
@media (pointer: coarse) { .card:not(.short) .card-head { min-height: 2.75rem; } }
@container (max-width: 10.5rem) { .card-head .stt { display: none; } }
.card-name { padding: .3rem .6rem 0; font-size: .9688rem; font-weight: 700; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-line { padding: .05rem .6rem 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-line b { font-weight: 700; color: var(--ink); }
.card-open { position: absolute; inset: 0; z-index: 1; border: 0; padding: 0; margin: 0; background: none; opacity: 0; cursor: inherit; }
.card-open:focus-visible { outline: 0; }
.card:has(.card-open:focus-visible) { outline: 2px solid var(--focus); outline-offset: 2px; }
.card.short .card-head { flex: 1; }
.card.short .card-head .who { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
[data-s="plan"] { --hb: var(--h-plan); --hf: var(--f-plan); }
[data-s="da"]   { --hb: var(--h-da);   --hf: var(--f-da); }
[data-s="work"] { --hb: var(--h-work); --hf: var(--f-work); }
[data-s="done"] { --hb: var(--h-done); --hf: var(--f-done); }
[data-s="gone"] { --hb: var(--h-gone); --hf: var(--f-gone); }
.card[data-s="gone"] { background: var(--card-gone); box-shadow: none; }
.card[data-s="gone"] .card-name { color: var(--f-gone); }
.card.is-sel { z-index: 3; box-shadow: 0 0 0 2.5px var(--ink), var(--sh-lift); }
.card.dragging { z-index: 6; pointer-events: none; scale: 1.03; box-shadow: var(--sh-lift); transition: scale var(--t-snappy) var(--snappy), box-shadow .2s var(--ease); }
@starting-style { .card.dragging { scale: 1; } }
html.is-dragging, html.is-dragging * { cursor: grabbing !important; -webkit-user-select: none; user-select: none; }

/* Seitenleiste */
.side { min-height: 0; display: flex; flex-direction: column; }
.panel { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; background: var(--panel); border-left: 1px solid var(--line); }
.p-scroll { flex: 1; min-height: 0; overflow: auto; overscroll-behavior: contain; padding-bottom: 1rem; scrollbar-color: var(--scroll) var(--panel); }
.p-head { display: flex; align-items: center; gap: .5rem; padding: 1.125rem .75rem .375rem 1.25rem; }
.p-head h2 { flex: 1; font-size: 1rem; font-weight: 700; }
.icon-btn { position: relative; display: grid; place-items: center; width: 2rem; height: 2rem; border: 0; border-radius: var(--r); background: none; color: var(--ink-2); transition: background-color .15s var(--ease); }
.icon-btn::after { content: ""; position: absolute; inset: -6px; }
.icon-btn:hover { background: var(--panel-2); color: var(--ink); }
.icon-btn svg { width: .75rem; height: .75rem; }
.back, .link { display: inline-flex; align-items: center; gap: .35rem; min-height: var(--target); padding: 0 .5rem; border: 0; border-radius: var(--r); background: none; color: var(--ink-2); font-size: .875rem; font-weight: 600; }
.back { margin: .75rem 0 0 .75rem; }
.link { justify-self: start; margin-left: -.5rem; }
.back:hover, .link:hover { background: var(--panel-2); color: var(--ink); }
.back svg { width: .7rem; height: .7rem; }
.link svg { width: .9rem; height: .9rem; }
.grp { display: flex; align-items: baseline; gap: .4rem; padding: 1rem 1.25rem .35rem; font-size: .8125rem; font-weight: 700; color: var(--ink); }
.grp small { font-size: .8125rem; font-weight: 600; color: var(--ink-2); }
.item {
  display: grid; grid-template-columns: 1fr auto; gap: .1rem .6rem; width: calc(100% - 1rem); margin: 0 .5rem;
  padding: .55rem .75rem .6rem; border: 0; border-radius: var(--r); background: none; text-align: left;
  transition: background-color .12s var(--ease);
}
.item + .item { box-shadow: 0 -1px 0 var(--line-soft); }
.item:hover { background: var(--panel-2); box-shadow: none; }
.item:hover + .item { box-shadow: none; }
.item .i-when { font-size: .8125rem; font-weight: 600; color: var(--ink-2); }
.item .i-name { grid-column: 1 / -1; font-size: .9375rem; font-weight: 700; }
.item .i-sub { grid-column: 1 / -1; font-size: .8125rem; color: var(--ink-2); overflow-wrap: anywhere; }
.item[aria-selected="true"], .orow[aria-selected="true"] { background: var(--act); color: var(--act-ink); box-shadow: none; }
.item[aria-selected="true"] + .item, .orow[aria-selected="true"] + .orow { box-shadow: none; }
.item[aria-selected="true"] .i-when, .item[aria-selected="true"] .i-sub, .orow[aria-selected="true"] .o-main span { color: color-mix(in srgb, var(--act-ink) 75%, var(--act)); }
mark { background: none; color: inherit; font-weight: 800; text-decoration: underline 2px; text-underline-offset: 2px; }
.chip-st { display: inline-flex; align-items: center; gap: .3rem; padding: .1rem .45rem; border-radius: 2px; background: var(--hb); color: var(--hf); font-size: .75rem; font-weight: 700; white-space: nowrap; }
.chip-st svg { height: .65rem; width: auto; }
.tag { padding: .1rem .45rem; border-radius: 2px; background: var(--panel-3); color: var(--ink); font-size: .75rem; font-weight: 700; white-space: nowrap; }
.more { margin: .75rem 1.25rem 0; }

/* Übersicht: eine Zeile pro Termin, Uhrzeit vorn */
.orow {
  display: grid; grid-template-columns: 3rem minmax(0, 1fr) auto; align-items: center; gap: .75rem;
  width: calc(100% - 1rem); margin: 0 .5rem; padding: .55rem .75rem; border: 0; border-radius: var(--r); background: none; text-align: left;
  transition: background-color .12s var(--ease);
}
.orow + .orow { box-shadow: 0 -1px 0 var(--line-soft); }

.orow:hover + .orow { box-shadow: none; }
.o-time { font-size: 1rem; font-weight: 700; }
.o-main { display: grid; min-width: 0; }
.o-main b { font-size: .9375rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.o-main span { font-size: .8125rem; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.empty { margin: .35rem 1.25rem; padding: .75rem .875rem; border: 1.5px dashed var(--line); border-radius: var(--r); color: var(--ink-2); font-size: .875rem; }
.p-foot { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem 1rem; padding: .625rem .75rem .625rem 1.25rem; border-top: 1px solid var(--line); color: var(--ink-2); font-size: .8125rem; }
.p-foot .theme { margin-left: auto; min-height: var(--target); padding: 0 .625rem; background: var(--panel-2); color: var(--ink); font-size: .8125rem; }
.p-foot .theme:hover { background: var(--panel-3); }
.p-foot .theme svg { width: .875rem; height: .875rem; }

.detail { display: flex; flex-direction: column; gap: 1rem; padding: .75rem 1.25rem 0; }
.d-head { display: flex; align-items: flex-start; gap: .5rem; }
.d-head > div { flex: 1; min-width: 0; }
.d-title { font-size: 1.375rem; font-weight: 700; line-height: 1.15; text-wrap: balance; }
.d-meta { margin-top: .25rem; color: var(--ink-2); font-size: .875rem; }
.d-state { display: flex; align-items: center; gap: .5rem; padding: .55rem .7rem; border-radius: var(--r); background: var(--hb); color: var(--hf); font-weight: 700; font-size: .875rem; }
.d-state svg { height: .8rem; width: auto; }
.d-state small { margin-left: auto; font-weight: 500; opacity: .85; }
.d-actions { display: flex; gap: .5rem; }
.btn.go { flex: 1; background: var(--act); color: var(--act-ink); }
.btn.go:hover { background: var(--act-h); }
.btn.quiet { background: var(--panel-2); color: var(--ink); }
.btn.quiet:hover { background: var(--panel-3); }
.btn.danger { color: var(--danger); }
.select-wrap select, .field select {
  -webkit-appearance: none; appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
  background-position: right .95rem center, right .65rem center;
  background-size: .3rem .3rem; background-repeat: no-repeat;
}
.select-wrap select { min-height: var(--target); padding: 0 1.75rem 0 .75rem; border: 0; border-radius: var(--r); background-color: var(--panel-2); color: var(--ink); font-weight: 600; font-size: .875rem; }
.select-wrap select:hover { background-color: var(--panel-3); }
.facts { display: grid; grid-template-columns: 6.25rem 1fr; border-radius: var(--r); background: var(--card); box-shadow: 0 0 0 1px var(--line-soft); font-size: .875rem; }
.facts dt, .facts dd { padding: .5rem .75rem; }
.facts dt { color: var(--ink-2); }
.facts dd { font-weight: 500; overflow-wrap: anywhere; }
.facts dt:not(:first-of-type), .facts dt:not(:first-of-type) + dd { border-top: 1px solid var(--line-soft); }
.d-links { display: flex; flex-wrap: wrap; gap: .5rem; }
.section-t { font-size: .8125rem; font-weight: 700; color: var(--ink); margin-bottom: .35rem; }
.hist .item { width: 100%; margin: 0; }
.section-t .tag { margin-left: .4rem; }
.msg-t { margin-bottom: .5rem; padding: .625rem .75rem; border: 1.5px dashed var(--line); border-radius: var(--r); font-size: .875rem; }
.msg-t small { display: block; margin-bottom: .2rem; font-size: .8125rem; color: var(--ink-2); }

/* Formular */
.form { display: grid; gap: .875rem; padding: .5rem 1.25rem 0; }
.field { display: grid; gap: .3rem; min-width: 0; }
.field label { font-size: .8125rem; font-weight: 600; color: var(--ink-2); }
.field .hint, .form > .hint, .set-body .hint { font-size: .8125rem; color: var(--ink-2); }
.field input, .field select {
  width: 100%; min-width: 0; min-height: var(--target); padding: 0 .625rem;
  border: 1.5px solid var(--line); border-radius: var(--r); background-color: var(--field); color: var(--ink); font-size: .9375rem;
  transition: border-color .15s var(--ease), box-shadow .15s var(--ease);
}
.field select { padding-right: 1.75rem; }
.field input:hover, .field select:hover { border-color: var(--ink-2); }
.field input:focus-visible, .field select:focus-visible { outline: 0; border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
.field input::placeholder { color: var(--ink-2); opacity: .8; }
.field input:user-invalid { border-color: var(--danger); background-color: var(--danger-bg); }
.field .err { display: none; font-size: .8125rem; font-weight: 600; color: var(--danger); }
.field input:user-invalid ~ .err { display: block; }
.sugg { transform-origin: 50% 0; animation: pop-in .24s var(--snappy); }
.sugg { display: grid; padding: .25rem; border-radius: var(--r); background: var(--card); box-shadow: 0 0 0 1px var(--line), var(--sh-card); }
.sugg [role="option"] { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: .75rem; align-items: baseline; padding: .45rem .5rem; border-radius: 2px; cursor: pointer; }
.sugg [role="option"] b { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sugg [role="option"] span { font-size: .8125rem; color: var(--ink-2); white-space: nowrap; }
.sugg [role="option"]:hover { background: var(--panel-2); }
.sugg [role="option"][aria-selected="true"] { background: var(--act); color: var(--act-ink); }
.sugg [role="option"][aria-selected="true"] span { color: color-mix(in srgb, var(--act-ink) 75%, var(--act)); }
.sugg p { padding: .45rem .5rem; font-size: .8125rem; color: var(--ink-2); }
.row2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .75rem; }
.row3 { display: grid; grid-template-columns: minmax(8.75rem, 1.5fr) minmax(0, 1fr) minmax(0, 1.1fr); gap: .625rem; }
.clash { display: grid; gap: .5rem; padding: .625rem .75rem; border-radius: var(--r); border: 1.5px dashed var(--ink); background: var(--card); color: var(--ink); font-size: .875rem; font-weight: 600; }
.clash div { display: flex; flex-wrap: wrap; gap: .4rem; }
.clash > span { display: flex; gap: .5rem; align-items: flex-start; }
.clash .btn { min-height: var(--target); background: var(--panel-2); color: var(--ink); font-size: .8125rem; }
.clash .btn:hover { background: var(--panel-3); }
.ok-slot { display: flex; align-items: center; gap: .45rem; font-size: .8125rem; font-weight: 600; color: var(--ink-2); }
.ok-slot svg { width: .8rem; height: .8rem; color: var(--ink); }
#f-slot { display: grid; gap: .5rem; }
.f-actions { display: flex; gap: .5rem; padding-top: .25rem; }

/* Meldungen */
.toasts { display: grid; gap: .5rem; pointer-events: none; }
.toasts:empty { display: none; }
.toast {
  pointer-events: auto; display: flex; align-items: flex-start; gap: .75rem; padding: .5rem .5rem .5rem .875rem;
  border-radius: 6px; background: var(--glass-bar); color: #FFFFFF; box-shadow: inset 0 1px 0 rgb(255 255 255 / .08), var(--sh-float); font-size: .875rem;
  -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
  transform-origin: 50% 100%; animation: toast-in var(--t-spring) var(--spring) both;
}
.toast.leaving { overflow: hidden; pointer-events: none; }
@keyframes toast-in { from { opacity: 0; translate: 0 14px; scale: .95; } }
.toast .warn { width: 1.1rem; height: 1.1rem; margin-top: .45rem; color: #FFFFFF; }
.toast p { flex: 1; padding-top: .45rem; }
.toast .btn { min-height: var(--target); padding: 0 .625rem; background: var(--bar-chip); color: #FFFFFF; font-size: .8125rem; }
.toast .btn:hover { background: var(--bar-chip-h); }
.toast .icon-btn { color: #C3CBD3; }
.toast .icon-btn:hover { background: var(--bar-chip); color: #FFFFFF; }
.toast :focus-visible { outline-color: #FFFFFF; }
@media (min-width: 68.8125rem) {
  .toasts { padding: .75rem; background: var(--panel); border-left: 1px solid var(--line); border-top: 1px solid var(--line); }
}

/* Rückfrage und Einstellungen */
dialog {
  border: 0; border-radius: 8px; color: var(--ink);
  background: var(--glass-panel); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
  box-shadow: inset 0 1px 0 var(--glass-edge), 0 0 0 1px var(--line-soft), var(--sh-float);
  opacity: 0; scale: .96;
  transition: opacity .18s var(--ease), scale .22s var(--ease), display .22s allow-discrete, overlay .22s allow-discrete;
}
dialog[open] { opacity: 1; scale: 1; transition: opacity .2s var(--ease), scale var(--t-spring) var(--spring), display .22s allow-discrete, overlay .22s allow-discrete; }
@starting-style { dialog[open] { opacity: 0; scale: .94; } }
dialog::backdrop {
  background: transparent; overflow: hidden; overscroll-behavior: contain;
  transition: background-color .25s var(--ease), -webkit-backdrop-filter .25s var(--ease), backdrop-filter .25s var(--ease), display .25s allow-discrete, overlay .25s allow-discrete;
}
dialog[open]::backdrop { background: var(--backdrop); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
@starting-style { dialog[open]::backdrop { background: transparent; -webkit-backdrop-filter: blur(0); backdrop-filter: blur(0); } }
dialog:modal { overscroll-behavior: contain; }
dialog.ask { width: min(26rem, calc(100% - 2rem)); padding: 1.25rem; }
dialog.ask h2 { font-size: 1.125rem; font-weight: 700; }
dialog.ask p { margin-top: .4rem; color: var(--ink-2); }
dialog.ask form { display: flex; justify-content: flex-end; gap: .5rem; margin-top: 1.25rem; }
dialog.ask .btn.danger-fill { background: var(--danger-fill); color: #FFFFFF; }
dialog.set { width: min(52rem, calc(100% - 2rem)); height: min(41rem, calc(100dvh - 2rem)); padding: 0; }
dialog.set[open] { display: flex; flex-direction: column; }
.set-head { display: flex; align-items: center; gap: .5rem; padding: 1.125rem .75rem .625rem 1.25rem; }
.set-head h2 { flex: 1; font-size: 1.125rem; font-weight: 700; }
.tabs { display: flex; gap: .375rem; padding: 0 1.25rem .75rem; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.tabs .btn { background: none; color: var(--ink-2); }
.tabs .btn:hover { background: var(--panel-2); color: var(--ink); }
.tabs .btn[aria-selected="true"] { background: var(--act); color: var(--act-ink); }
.set-body { flex: 1; min-height: 0; overflow: auto; overscroll-behavior: contain; padding: 1rem 1.25rem 1.25rem; scrollbar-color: var(--scroll) transparent; }
.set-body > section { display: grid; gap: .75rem; }
.set-body .form { padding: 0; }
.set-foot { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; padding: .625rem 1.25rem .875rem; border-top: 1px solid var(--line); }
.set-foot p { flex-basis: 100%; min-height: 1.4em; font-size: .8125rem; color: var(--ink-2); }
.set-foot .go { flex: none; margin-left: auto; }
.sv-list { display: grid; gap: .375rem; }
.sv { display: grid; grid-template-columns: minmax(8rem, 1fr) 6.75rem calc(var(--days) * (var(--target) + .25rem) - .25rem) 8rem 2rem; align-items: center; gap: .5rem; }
.sv-head { font-size: .8125rem; font-weight: 600; color: var(--ink-2); }
.days { display: flex; gap: .25rem; }
.day span {
  display: grid; place-items: center; width: var(--target); height: var(--target); border-radius: var(--r);
  background: var(--panel-2); color: var(--ink-2); font-size: .8125rem; font-weight: 600; text-decoration: line-through; cursor: pointer;
  transition: background-color .15s var(--ease), color .15s var(--ease);
}
.day:hover span { background: var(--panel-3); }
.day input:checked + span { background: var(--act); color: var(--act-ink); text-decoration: none; }
.day input:focus-visible + span { outline: 2px solid var(--focus); outline-offset: 2px; }
.oh { display: flex; flex-wrap: wrap; align-items: center; gap: .375rem .75rem; min-height: calc(var(--target) + .75rem); padding: .375rem 0; }
.oh + .oh { border-top: 1px solid var(--line-soft); }
.oh strong { flex: 0 0 6.5rem; font-weight: 700; }
.oh .check { flex: 0 0 7rem; }
.oh .field { flex: 0 0 6.5rem; }
.oh > span { color: var(--ink-2); font-size: .875rem; }
.ab { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1.5fr) minmax(0, 1fr) 2rem; align-items: center; gap: .125rem .75rem; min-height: calc(var(--target) + .75rem); padding: .375rem 0; overflow-wrap: anywhere; }
.ab + .ab { border-top: 1px solid var(--line-soft); }
.ab strong { font-weight: 700; }
.row4 { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(8.75rem, 1fr) minmax(8.75rem, 1fr) minmax(0, 1.2fr); gap: .625rem; }
.check { display: inline-flex; align-items: center; gap: .5rem; min-height: var(--target); cursor: pointer; }
.check input { width: 1.125rem; height: 1.125rem; margin: 0; }

/* Schmale Fenster: Seitenleiste wird zur Fläche von unten, die Meldung sitzt auf ihrer Oberkante und verdeckt darin nichts */
@media (max-width: 68.75rem) {
  .work { grid-template-columns: minmax(0, 1fr); }
  .side { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; flex-direction: column-reverse; pointer-events: none; }
  .panel {
    flex: none; max-height: 50dvh; pointer-events: auto; overflow: visible;
    border-left: 0; border-radius: 12px 12px 0 0; box-shadow: inset 0 1px 0 var(--glass-edge), 0 0 0 1px var(--line-soft), var(--sh-float);
    background: var(--glass-panel); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    transition: translate var(--t-spring) var(--spring), visibility 0s;
  }
  /* Die Feder schwingt leicht über: ein Streifen unter dem Blatt verdeckt die Lücke */
  .panel::after { content: ""; position: absolute; left: 0; right: 0; top: 100%; height: 3rem; background: inherit; }
  .panel > .p-scroll { scrollbar-color: var(--scroll) transparent; }
  .panel[data-view="idle"] { position: absolute; left: 0; right: 0; bottom: 0; translate: 0 calc(100% + 3rem); visibility: hidden; transition: translate .3s var(--ease), visibility 0s .3s; }
  .toasts { align-self: flex-start; width: min(26rem, calc(100% - 2rem)); margin: 0 max(1rem, env(safe-area-inset-left, 0px)) .5rem; }
  .side:has(.panel[data-view="idle"]) .toasts { margin-bottom: calc(1rem + env(safe-area-inset-bottom, 0px)); }
  html.is-dragging .toast { pointer-events: none; opacity: .4; }
  .app:has(.panel:not([data-view="idle"])) .week { display: none; }
  .app:has(.panel:not([data-view="idle"])) .plate, .app:has(.panel:not([data-view="idle"])) .month { padding-bottom: 50dvh; }
}
/* Tablet und kleiner Laptop: Die Suche rückt neben den Namen, damit die Kopfleiste zweizeilig bleibt */
@media (min-width: 45.0625rem) and (max-width: 89.9375rem) {
  .brand { flex: 0 1 24rem; margin-bottom: 0; }
  .trail { order: 1; flex-basis: calc(100% - 25rem); }
  .date-pick, #todayBtn, .seg, .sum { order: 2; }
}
@media (max-width: 61.5rem) {
  .btn.new .lbl, .btn.find .lbl, .sum .lg { display: none; }
  .btn.new, .btn.find { width: calc(var(--target) + .125rem); padding: 0; }
}
/* Solange das Fenster der Einstellungen nicht seine volle Breite hat, bekommt der Name der Leistung eine eigene Zeile */
@media (max-width: 54rem) {
  .sv-head { display: none; }
  .sv { grid-template: "name name del" "dur lane lane" "days days days" / minmax(0, 1fr) minmax(0, 1fr) 2rem; padding: .625rem 0; }
  .sv + .sv { border-top: 1px solid var(--line-soft); }
  .sv-list { gap: 0; }
  .sv-name { grid-area: name; }
  .sv-dur { grid-area: dur; }
  .sv-lane { grid-area: lane; }
  .sv .days { grid-area: days; }
  .sv .icon-btn { grid-area: del; }
}
@media (max-width: 45rem) {
  .bar { gap: .5rem; }
  .title { font-size: 1.25rem; }
  .trail { order: 3; flex-basis: 100%; }
  .search { max-width: none; }
  .search kbd { display: none; }
  .sum { order: 4; padding: 0; font-size: .8125rem; }
  .seg { order: 5; margin-left: auto; }
  .mo-nav { margin-right: .5rem; }
  .demo .dt { display: none; }
  .panel { max-height: 55dvh; }
  .app:has(.panel:not([data-view="idle"])) .plate, .app:has(.panel:not([data-view="idle"])) .month { padding-bottom: 55dvh; }
  .mo { grid-auto-rows: minmax(6rem, auto); }
  .mo-h, .md { padding-inline: .3rem; }
  .md { font-size: .75rem; }
  .md-s svg { display: none; }
  .md-a .full { display: none; }
  .md-a .brief { display: inline; }
  .plate { grid-template-columns: 3rem repeat(var(--lanes), minmax(9.5rem, 1fr)); }
  .now { left: 3rem; }
  .row3 { grid-template-columns: 1fr 1fr; }

  .set-body { padding-inline: 1rem; }
  .set-foot { padding-inline: 1rem; }
  .ab { grid-template-columns: minmax(0, 1fr) 2rem; }
  .ab .icon-btn { grid-column: 2; grid-row: 1 / span 3; }
  .row4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .row4 > :first-child, .row4 > :last-child { grid-column: 1 / -1; }
}
/* Bewegung: Drücken gibt nach, Loslassen federt zurück */
:is(.btn, .wk-nav, .wd, .md, .icon-btn, .item, .orow, .title, .sum, .back, .link, .search .clear, .select-wrap select) {
  transition-property: background-color, box-shadow, color, scale;
  transition-duration: .15s, .15s, .15s, var(--t-snappy);
  transition-timing-function: var(--ease), var(--ease), var(--ease), var(--snappy);
}
:is(.btn, .wk-nav, .icon-btn, .title, .sum, .back, .link, .search .clear, .select-wrap select):active { scale: .96; transition-duration: .15s, .15s, .15s, .08s; }
:is(.wd, .md, .item, .orow):active { scale: .985; transition-duration: .15s, .15s, .15s, .08s; }
.search { transition: box-shadow .2s var(--ease), background-color .2s var(--ease); }
@keyframes fade-in { from { opacity: 0; } }
@keyframes pop-in { from { opacity: 0; translate: 0 -4px; scale: .98; } }
.clash, .ok-slot { animation: pop-in .26s var(--snappy); }
.field .err { animation: pop-in .2s var(--snappy); }

/* Wechsel zwischen hell und dunkel: das neue Design wächst kreisförmig vom Schalter aus */
::view-transition-old(root), ::view-transition-new(root) { animation: none; mix-blend-mode: normal; }
::view-transition-new(root) { z-index: 1; }

/* Weniger Transparenz oder mehr Kontrast: Glas wird zur festen Fläche */
@media (prefers-reduced-transparency: reduce), (prefers-contrast: more) {
  :root { --glass: var(--board); --glass-panel: var(--panel); --glass-bar: var(--bar); --blur: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: 0s !important; animation-duration: 0s !important; }
  .now::after { display: none; }
}
@media (forced-colors: active) {
  .card-head, .d-state, .chip-st { forced-color-adjust: none; }
  .ghost { border-color: Highlight; }
}

/* Tagesliste: auf Papier nur die Liste, schwarz auf weiß */
.print { display: none; }
@media print {
  @page { size: A4 portrait; margin: 14mm; }
  html, body { height: auto; overflow: visible; background: #FFFFFF; }
  .app, dialog { display: none !important; }
  .print { display: block; color: #000000; font: 400 9.5pt/1.3 var(--font); }
  .print h1 { font-size: 16pt; font-weight: 700; }
  .print > p { margin-bottom: 7mm; font-size: 11pt; }
  .print h2 { margin: 6mm 0 2mm; font-size: 12pt; font-weight: 700; }
  .print h2 span { font-size: 9.5pt; font-weight: 400; }
  .print table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  .print th, .print td { padding: 1.4mm 1.5mm; border: .3mm solid #000000; text-align: left; vertical-align: top; overflow-wrap: anywhere; }
  .print th { font-weight: 700; }
  .print th:nth-child(1) { width: 13.5%; }
  .print th:nth-child(2) { width: 17%; }
  .print th:nth-child(4) { width: 12.5%; }
  .print th:nth-child(7) { width: 15%; }
  .print tr { break-inside: avoid; }
  .print .blank td { height: 8mm; }
}

  const STORE = 'werkstattplaner';
  function readSettings(o) {

  const dayOk = (s, k) => !s.days || s.days.includes(fromKey(k).getDay());

  const advs = (days) => [...days].sort((x, y) => ((x + 6) % 7) - ((y + 6) % 7)).map((wd) => WD[wd].adv);
  const laneNames = (lanes) => lanes.map((i) => settings.lanes[i].name);

  /* ---------- Verfügbarkeit: nur hier werden Öffnungszeiten und Abwesenheiten gelesen ---------- */
  // Ein Eintrag für die ganze Werkstatt geht dem eines Mechanikers vor.
  function absenceIn(s, k, lane) {
    const hit = s.absences.filter((x) => (x.lane == null || x.lane === lane) && x.from <= k && k <= x.to);
    return hit.find((x) => x.lane == null) || hit[0] || null;
  }
  function windowIn(s, k, lane) {
    const h = s.hours[fromKey(k).getDay()];
    return h && !absenceIn(s, k, lane) ? { open: h[0], close: h[1] } : null;
  }
  function dayWindowIn(s, k) {
    const ws = s.lanes.map((_, lane) => windowIn(s, k, lane)).filter(Boolean);
    return ws.length ? { open: Math.min(...ws.map((w) => w.open)), close: Math.max(...ws.map((w) => w.close)) } : null;
  }
  function nextOpenIn(s, d) {
    for (let i = 0; i < 366; i++, d = addDays(d, 1)) if (dayWindowIn(s, key(d))) return d;
    return null;
  }
  const windowOf = (k, lane) => windowIn(settings, k, lane);
  const laneWindows = (k) => settings.lanes.map((_, lane) => windowOf(k, lane));
  const dayWindow = (k) => dayWindowIn(settings, k);
  const nextOpenDay = (d) => nextOpenIn(settings, d);
  function shutWord(k, lane) {
    const x = absenceIn(settings, k, lane);
    return (dayWindow(k) ? 'nicht da' : 'geschlossen') + (x && x.label ? ' · ' + x.label : '');
  }
  // Wer an einem offenen Wochentag fehlt und warum: ein Eintrag für die ganze Werkstatt, sonst einer je Mechaniker.
  // „brief“ steht in schmalen Monatszellen: Ein langer Grund bricht dort ohne Trennwörterbuch mitten im Wort.
  function away(k) {
    if (!settings.hours[fromKey(k).getDay()]) return [];
    const xs = settings.lanes.map((_, lane) => absenceIn(settings, k, lane));
    if (xs.every((x) => x && x.lane == null)) return [{ text: xs[0].label || 'geschlossen', brief: 'zu' }];
    return xs.map((x, lane) => x && { text: settings.lanes[lane].name + ': ' + (x.label || 'nicht da'), brief: settings.lanes[lane].name + ' fehlt' }).filter(Boolean);
  }
  const capacity = (k) => laneWindows(k).reduce((sum, w) => sum + (w ? w.close - w.open : 0), 0);
  const openWeekdays = () => [1, 2, 3, 4, 5, 6, 0].filter((wd) => settings.hours[wd]);
  let boardFrom, boardTo;
  function fitBoard() {
    const h = Object.values(settings.hours);
    let lo = h.length ? Math.min(...h.map((x) => x[0])) : 9 * 60, hi = h.length ? Math.max(...h.map((x) => x[1])) : 17 * 60;
    // Eigene Termine von vor einer Zeitänderung bleiben auf der Tafel sichtbar.
    for (const a of A) { lo = Math.min(lo, a.start); hi = Math.max(hi, a.start + a.dur); }
    boardFrom = Math.max(0, Math.floor(lo / 60) * 60 - 60);
    boardTo = Math.min(1440, Math.ceil(hi / 60) * 60 + 60);
  }

  /* ---------- Uhr: echte Zeit im heutigen Zeitfenster, sonst nächster offener Tag 40 Minuten nach Öffnung ---------- */
  function clockIn(s) {
    const real = new Date(), realMin = real.getHours() * 60 + real.getMinutes();
    const d0 = new Date(real.getFullYear(), real.getMonth(), real.getDate()), w0 = dayWindowIn(s, key(d0));
    const next = w0 && realMin >= w0.open && realMin < w0.close ? null : nextOpenIn(s, w0 && realMin < w0.open ? d0 : addDays(d0, 1));

  }
  let today, todayKey, nowMin, simulated;
  function setClock() {
    ({ today, simulated, nowMin } = clockIn(settings));
    todayKey = key(today);
  }
  setClock();

  /* ---------- Erfundene Kundschaft und Termine ---------- */
  const CUSTOMERS = [];
  (() => {
    const r = rng('kundschaft'), L = 'ABCDEFGHJKLMNPRSTUVWXYZ';
    const plate = () => pick(r, ['KS', 'KS', 'KS', 'KS', 'HR', 'ESW', 'GÖ']) + '-' + L[Math.floor(r() * L.length)] + L[Math.floor(r() * L.length)] + ' ' + (10 + Math.floor(r() * 9890));
    const names = [];
    for (let f = 0; f < FIRST.length; f++) for (let l = 0; l < LAST.length; l++) names.push(FIRST[f] + ' ' + LAST[l]);
    for (let i = names.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [names[i], names[j]] = [names[j], names[i]]; }
    names.filter((n) => !/Bauer$/.test(n)).forEach((n, i) => CUSTOMERS.push({ name: n, phone: '0151 555 ' + String(1000 + i).padStart(4, '0'), car: pick(r, CARS), plate: plate() }));
    CUSTOMERS.push({ name: 'Sabine Bauer', phone: '0151 555 0188', car: 'Škoda Octavia Combi', plate: 'KS-CP 5252' });
    CUSTOMERS.push({ name: 'Bauer Gartenbau GmbH', phone: '0151 555 0189', car: 'VW Caddy', plate: 'KS-TT 410' });
    CUSTOMERS.push({ name: 'Bäckerei Hoffmann', phone: '0151 555 0190', car: 'VW Crafter', plate: plate() });
    CUSTOMERS.push({ name: 'Pflegedienst Sonnenhof', phone: '0151 555 0191', car: 'VW up!', plate: plate() });
    CUSTOMERS.push({ name: 'Malerbetrieb Renner', phone: '0151 555 0192', car: 'Ford Transit', plate: plate() });
  })();

  const A = [], BY = new Map();
  let seq = 1;
  const SEED_BACK = 42, SEED_AHEAD = 63;
  const LOADS = [.95, .95, .85, .6, .5, .5, .3, .1];
  const clash = (k, lane, start, len, except) => A.find((x) => x.key === k && x.lane === lane && x.id !== except && x.start < start + len && start < x.start + x.dur);
  function seed() {
    for (let i = A.length - 1; i >= 0; i--) if (!A[i].fresh) { BY.delete(A[i].id); A.splice(i, 1); }
    const add = (k, lane, start, len, c, service, note) => A.push({ id: seq++, key: k, lane, start, dur: len, c, service, note, status: null });
    // Lange Arbeiten brauchen ein ganzes Zeitfenster. Das längste der nächsten drei Wochen bleibt darum bei einem Mechaniker leer.
    const soon = nextOpenDay(addDays(today, 3)), soonKey = soon && key(soon);
    let spare = null;
    for (let off = 1; off <= 20; off++) settings.lanes.forEach((_, lane) => {
      const k = key(addDays(today, off)), w = windowOf(k, lane);
      if (w && w.close - w.open > (spare ? spare.len : 0) && !(k === soonKey && lane === 1)) spare = { k, lane, len: w.close - w.open };
    });
    for (let off = -SEED_BACK; off <= SEED_AHEAD; off++) {
      const k = key(addDays(today, off)), r = rng('tag' + k), used = new Set();

      const load = Math.max(off ? 0 : .6, pick(r, LOADS)), solo = load > .3 ? -1 : Math.floor(r() * settings.lanes.length);
      settings.lanes.forEach((_, lane) => {

        const budget = load * (w.close - w.open), can = settings.services.filter((s) => dayOk(s, k) && laneOk(s, lane));
        let at = w.open + (load > .8 ? 0 : pick(r, [0, 15, 30, 60])), sum = 0;
        while (sum < budget) {

          if (!fits.length) break;
          const s = pick(r, fits), own = clash(k, lane, at, s.dur);
          if (own) { at = own.start + own.dur; continue; }

      for (let i = A.length - 1; i >= 0; i--) { const x = A[i]; if (!x.fresh && x.key === k && ((x.lane === lane && x.start < start + len && start < x.start + x.dur) || x.c === c)) A.splice(i, 1); }
      if (!clash(k, lane, start, len)) add(k, lane, start, len, c, service, note);

    put(soon, 1, 120, 30, 'Bauer Gartenbau GmbH', 'Reifenwechsel', '');
    put(nextOpenDay(addDays(today, -35)), 1, 30, 45, 'Sabine Bauer', 'Ölwechsel', '');
    A.forEach(enroll);

  }

  function enroll(a) {

    BY.set(a.id, a);
    index(a);
  }

    if (a.key > todayKey) return 'plan';
    const e = a.start + a.dur;
    if (e <= nowMin - 45) return 'gone';
    if (e <= nowMin) return 'done';
    if (a.start <= nowMin) return 'work';
    if (a.start - nowMin <= 45) return 'da';
    return 'plan';
  }
  function index(a) {
    a.words = norm([a.c.name, a.c.car, a.service, a.note, settings.lanes[a.lane].name].join(' ')).split(/[^a-z0-9]+/).filter(Boolean);
    a.pl = norm(a.c.plate).replace(/[^a-z0-9]/g, '');

  /* ---------- Termine merken: Stand im Browser, gültig für diesen Tag und diese Zeiten ---------- */
  const KEEP = STORE + '-termine';
  const CID = new Map(CUSTOMERS.map((c, i) => [c, i]));

    try { localStorage.setItem(KEEP, JSON.stringify({ today: todayKey, basis: seedBasis(), list })); } catch (_) {}
  }
  function readAppt(x) {
    const int = Number.isInteger, text = (v) => (typeof v === 'string' ? v : '');
    const c = x && (int(x.c) ? CUSTOMERS[x.c] : x.c && typeof x.c.name === 'string' && x.c.name ? { name: x.c.name, phone: text(x.c.phone), plate: text(x.c.plate), car: text(x.c.car) } : null);
    if (!c || !int(x.id) || !isKey(x.key) || !int(x.lane) || !settings.lanes[x.lane] || !int(x.start) || !int(x.dur) || x.dur <= 0 || typeof x.service !== 'string') return null;
    const status = Object.hasOwn(ST, x.status) ? x.status : null, fresh = x.fresh === true;
    return { id: x.id, key: x.key, lane: x.lane, start: x.start, dur: x.dur, c, service: x.service, note: text(x.note), status, since: int(x.since) ? x.since : null, fresh, manual: !fresh && !!status };
  }
  function loadAppts() {
    let snap = null;
    try { snap = JSON.parse(localStorage.getItem(KEEP)); } catch (_) {}
    const ids = new Set(), list = snap && Array.isArray(snap.list) ? snap.list.map(readAppt).filter((a) => a && !ids.has(a.id) && ids.add(a.id)) : null;
    const same = list && snap.today === todayKey && snap.basis === seedBasis();

  }
  // Jede Änderung an Terminen läuft hier durch: für Rückgängig merken, dann speichern.

  }
  const place = (a) => ({ key: a.key, lane: a.lane, start: a.start, dur: a.dur });

  // Einziger Weg von der Tafel. Was gerade auf den Termin zeigt, schließt mit.
  function take(a) {
    const i = A.indexOf(a);

  }
  loadAppts();
  fitBoard();

  /* ---------- Zustand ---------- */
  let cur = today;
  let mode = 'day';           // day | month
  let view = 'idle';          // idle | overview | search | detail | form | finder
  let selId = null;           // ausgewählte Karte
  let fromSearch = false;
  let searchHome = null;      // Tag vor der Suche

  let formState = null;       // { mode, id, dirty, fromFinder }
  let finder = null;          // { service, from, part, lane, limit, shown, days, active, home, draft, dirty, back }
  const undoStack = [];

  const plateEl = $('plate'), scroller = $('scroller'), monthEl = $('month'), panel = $('panel'), q = $('q');

  const dayAppts = (k) => A.filter((a) => a.key === k);
  const booked = (k) => dayAppts(k).reduce((s, a) => s + a.dur, 0);
  const fmtHours = (min) => (min / 60).toLocaleString('de-DE', { maximumFractionDigits: 1 });
  function dayStat(k) {

  }

  function laneState(k, lane) {

  /* ---------- Kopfleiste und Woche ---------- */

  /* ---------- Tafel ---------- */

  let boardKey = null, mainMode = null;
  function snapshotCards() {

      const r = el.getBoundingClientRect(), dx = b.r.left - r.left, dy = b.r.top - r.top;

  const sheetMode = () => matchMedia('(max-width: 68.75rem)').matches && panel.dataset.view !== 'idle';
  function visibleHeight(el) {

  }
  function scrollToMinute(min, smooth) { scroller.scrollTo({ top: minuteTop(min), behavior: scrollHow(smooth) }); }
  function reveal(el, start, smooth) {

    const lane = el.parentElement, lx = lane.offsetLeft, rx = lx + lane.offsetWidth;

  /* ---------- Seitenleiste ---------- */

  };
  /* Übergang der Seitenleiste: tiefer hinein kommt von rechts, zurück von links, Gleichrangiges blendet auf */

    [...parts].slice(0, 14).forEach((el, i) => anim(el, BLUR_IN(d > 0 ? 16 : d < 0 ? -16 : 0, d ? 0 : 6), { delay: Math.min(i, 8) * 22, fill: 'backwards' }));
  }
  function renderPanel() {
    panel.dataset.view = view;

  function renderIdle() {
    const list = dayAppts(todayKey);

      '<p class="grp">Fertig zur Abholung <small>' + ready.length + '</small></p>' + (ready.length ? ready.map(orowHtml).join('') : '<p class="empty">Gerade ist kein Fahrzeug fertig.</p>') +

  /* Hell und dunkel: ohne Einstellung folgt die Seite dem System */

  function toggleTheme() {

  /* Suche */
  function highlight(text, toks) {
    const chars = [...text];
    const flat = chars.map((ch) => { const x = norm(ch); return x ? x[0] : ' '; }).join('');
    const on = new Array(chars.length).fill(false);
    const re = /[a-z0-9]+/g;
    let m;
    while ((m = re.exec(flat))) for (const t of toks) if (m[0].startsWith(t)) for (let i = 0; i < t.length && m.index + i < on.length; i++) on[m.index + i] = true;
    let out = '', open = false;
    chars.forEach((ch, i) => {
      if (on[i] && !open) { out += '<mark>'; open = true; }
      if (!on[i] && open) { out += '</mark>'; open = false; }
      out += esc(ch);
    });
    return out + (open ? '</mark>' : '');
  }
  function runSearch() {
    const v = q.value.trim();

    $('qKbd').hidden = !!v;
    if (!v) { endSearch(false); return; }
    if (view !== 'search') { searchHome = searchHome || cur; }
    view = 'search';
    const toks = norm(v).split(/[^a-z0-9]+/).filter(Boolean);
    const plateTok = norm(v).replace(/[^a-z0-9]/g, '');
    const all = toks.length ? A.filter((a) => toks.every((t) => a.words.some((w) => w.startsWith(t)) || (t.length >= 2 && a.pl.includes(t)) || (/^\d{3,}$/.test(t) && a.ph.includes(t))) || (plateTok.length >= 4 && a.pl.includes(plateTok))) : [];

    const past = all.filter((a) => !up(a)).sort((x, y) => (ord(x) < ord(y) ? 1 : -1));

  /* Details */

  const PARTS = { any: [0, 1440], am: [0, 720], pm: [720, 1440] };
  function findSlots(appts, s, q) {
    const out = [], len = q.service.dur, [from, to] = PARTS[q.part], busy = new Map();
    for (const a of appts) { const id = a.key + ':' + a.lane; (busy.get(id) || busy.set(id, []).get(id)).push(a); }
    let d = fromKey(q.from > q.now.key ? q.from : q.now.key);
    for (let i = 0; i < q.days; i++, d = addDays(d, 1)) {
      const k = key(d);
      if (!dayOk(q.service, k)) continue;
      s.lanes.forEach((_, lane) => {
        const w = windowIn(s, k, lane);
        if (!w || (q.lane != null && q.lane !== lane) || !laneOk(q.service, lane)) return;
        const taken = (busy.get(k + ':' + lane) || []).sort((x, y) => x.start - y.start);
        let free = k === q.now.key ? Math.max(w.open, Math.ceil(q.now.min / STEP) * STEP) : w.open;
        // Je Lücke nur zwei Angebote: direkt am Anfang und, falls anders, bündig am Ende. So zerfällt der Tag nicht in Reste.
        for (const a of [...taken, { start: w.close, dur: 0 }]) {

          }
          free = Math.max(free, a.start + a.dur);

    return out.sort((x, y) => (x.day < y.day ? -1 : x.day > y.day ? 1 : x.start - y.start || x.lane - y.lane));

  setDlg.addEventListener('submit', (e) => {
    e.preventDefault();
    const from = $('ab-from').value, to = $('ab-to').value || from, lane = $('ab-who').value === '' ? null : +$('ab-who').value;
    if (!isKey(from)) { $('setNote').textContent = 'Bitte bei „Von“ ein Datum wählen.'; $('ab-from').focus(); return; }
    if (!isKey(to) || to < from) { $('setNote').textContent = '„Bis“ liegt vor „Von“.'; $('ab-to').focus(); return; }
    settings.absences.push({ lane, from, to, label: $('ab-why').value.trim() });
    settings.absences.sort((x, y) => (x.from < y.from ? -1 : x.from > y.from ? 1 : 0));
    const own = A.filter((a) => a.fresh && a.key >= todayKey && from <= a.key && a.key <= to && (lane == null || a.lane === lane));
    applySettings(true, !own.length ? '' : 'Gespeichert. In dieser Zeit ' + (own.length === 1
      ? 'liegt ein eigener Termin: ' + own[0].c.name + ', ' + dayLabel(own[0].key) + ' um ' + hm(own[0].start) + ' Uhr. Er bleibt bestehen.'
      : 'liegen ' + own.length + ' eigene Termine. Sie bleiben bestehen.'));
    drawAway();
    $('ab-who').focus();
  });
  setDlg.addEventListener('click', async (e) => {
    const t = e.target, tab = t.closest('[role="tab"]'), del = t.closest('[data-sv-del]'), abDel = t.closest('[data-ab-del]');
    if (tab) showTab(tab);
    else if (t.closest('[data-set-close]')) setDlg.close();
    else if (t.closest('#svAdd')) {
      let name = 'Neue Leistung';
      for (let n = 2; svcOf(name); n++) name = 'Neue Leistung ' + n;
      settings.services.push({ name, dur: 60, days: null, lanes: null });
      applySettings(false);
      drawServices();
      const inp = $('sv-name-' + (settings.services.length - 1));
      inp.focus(); inp.select();
    } else if (del) {
      const [gone] = settings.services.splice(+del.dataset.svDel, 1);
      applySettings(false, '„' + gone.name + '“ gelöscht.');
      drawServices();
      $('sv-name-' + Math.min(+del.dataset.svDel, settings.services.length - 1)).focus();
    } else if (abDel) {
      settings.absences.splice(+abDel.dataset.abDel, 1);
      applySettings(true);
      drawAway();
      const rest = setDlg.querySelectorAll('[data-ab-del]');
      (rest[Math.min(+abDel.dataset.abDel, rest.length - 1)] || $('ab-who')).focus();
    } else if (t.closest('#setReset')) {
      if (!(await ask({ title: 'Demo zurücksetzen?', text: 'Einstellungen und Beispieltermine stehen danach wieder wie am Anfang. Eigene Termine und alle Änderungen gehen verloren.', keep: 'Behalten', act: 'Zurücksetzen' }))) return;
      settings = defaults();
      A.length = 0;
      BY.clear();
      applySettings(true, 'Demo zurückgesetzt. Einstellungen und Termine sind wieder wie am Anfang.');
      try { localStorage.removeItem(STORE); localStorage.removeItem(KEEP); } catch (_) {}
      drawServices(); drawHours(); drawAway(); drawShop();
    }
  });
  setDlg.addEventListener('keydown', (e) => {
    const tab = e.target.closest('[role="tab"]');
    if (!tab) return;
    const tabs = [...setDlg.querySelectorAll('[role="tab"]')], i = tabs.indexOf(tab);
    const to = { ArrowRight: tabs[(i + 1) % tabs.length], ArrowLeft: tabs[(i - 1 + tabs.length) % tabs.length], Home: tabs[0], End: tabs[tabs.length - 1] }[e.key];
    if (to) { e.preventDefault(); showTab(to, true); }
  });

  for (const el of [scroller, monthEl]) {
    let raf = 0;
    el.addEventListener('scroll', () => {
      if (raf) return;
      raf = requestAnimationFrame(() => { raf = 0; el.classList.toggle('sy', el.scrollTop > 2); el.classList.toggle('sx', el.scrollLeft > 2); });
    }, { passive: true });
  }
  // Die Woche ist auf schmalen Fenstern und im Monat zeitweise ausgeblendet: Markierung beim Wiedererscheinen nachziehen
  if (window.ResizeObserver) new ResizeObserver(() => placePill()).observe($('week'));

  let lastHour = hourPx();
  window.addEventListener('resize', () => { const h = hourPx(); if (h !== lastHour) { lastHour = h; renderMain(); } });
  setInterval(() => {
    const n = new Date(); const m = n.getHours() * 60 + n.getMinutes();
    if (!simulated && m !== nowMin && key(n) === todayKey) { nowMin = m; if (!drag) { renderBar(); if (mode === 'day') renderBoard(); } }
  }, 30000);

  /* Tagesliste: wird erst beim Drucken gezeichnet, auch über das Menü des Browsers */
  window.addEventListener('beforeprint', () => {
    const k = key(cur), list = dayAppts(k).sort((x, y) => x.start - y.start);
    $('print').innerHTML = '<h1>' + esc(settings.shop) + '</h1><p>Tagesliste für ' + esc(dfLong.format(cur)) + '</p>' + settings.lanes.map((l, i) => {
      const w = windowOf(k, i);
      return '<h2>' + esc(l.name) + ' <span>' + esc(l.place + ', ' + (w ? hm(w.open) + ' bis ' + hm(w.close) + ' Uhr' : shutWord(k, i))) + '</span></h2>' +
        '<table><thead><tr>' + ['Zeit', 'Kunde', 'Fahrzeug', 'Kennzeichen', 'Leistung', 'Notiz', 'Telefon'].map((t) => '<th scope="col">' + t + '</th>').join('') + '</tr></thead><tbody>' +
        list.filter((a) => a.lane === i).map((a) => '<tr>' + [hm(a.start) + '–' + hm(a.start + a.dur), a.c.name, a.c.car, a.c.plate, a.service, a.note, a.c.phone].map((t) => '<td>' + esc(t) + '</td>').join('') + '</tr>').join('') +
        ('<tr class="blank">' + '<td></td>'.repeat(7) + '</tr>').repeat(4) + '</tbody></table>';
    }).join('');
  });

  render();
  requestAnimationFrame(() => scrollToMinute(nowMin, false));
})();
</script>
</body>
</html>
